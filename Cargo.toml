[package]
name = "ferrite11"
version = "0.6.1"
edition = "2024"
authors = ["Ferrite11 contributors"]
description = "Optimiseur graphique universel, prudent et réversible pour Windows 11"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", features = ["transactions"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
